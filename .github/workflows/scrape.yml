name: Scrape

# Manual trigger ONLY for the skeleton phase. No cron until the project
# deploys — an unattended schedule scraping retailers for a site nobody
# can see is discourteous traffic (PLAN section 2).
on:
  workflow_dispatch:

permissions:
  contents: write

# Two dispatches would race the same branch on push. Queue instead of
# colliding; never cancel a run mid-scrape.
concurrency:
  group: scrape-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ~8 mapped products x 2 requests x 15s worst-case delay is well under
    # 10 minutes; 30 leaves honest headroom without masking a hang.
    # Keep in step with CI_TIMEOUT_SECONDS in scrapers/runner.py.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- Each retailer runs as its own step with continue-on-error ---
      - name: Scrape shop-solar-kits
        continue-on-error: true
        id: shop_solar_kits
        run: python -X utf8 -m scrapers.runner --retailer shop-solar-kits --skip-promos

      - name: Scrape wild-oak-trail
        continue-on-error: true
        id: wild_oak_trail
        run: python -X utf8 -m scrapers.runner --retailer wild-oak-trail --skip-promos

      # Tests are fixture-based: they validate CODE, not this run's data,
      # so a failure is an alarm, not a publish block.
      - name: Run tests
        run: |
          set +e
          python -X utf8 -m pytest -q > pytest_out.txt 2>&1
          code=$?
          set -e
          tail -40 pytest_out.txt
          if [ "$code" != "0" ]; then
            echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
            echo "::error::pytest failed (exit $code) — see log above"
          fi

      - name: Build site
        run: python -X utf8 build.py

      # The correctness loop (PLAN 4b/4c): site-vs-store and store-vs-live.
      # continue-on-error so a defect never blocks publishing GOOD data;
      # the exit code is surfaced in the alarm step (0 clean, 3 render
      # defect, 4 incomplete/unverified).
      - name: Audit site vs sources
        id: audit
        continue-on-error: true
        run: |
          set +e
          python -X utf8 audit.py --all
          code=$?
          set -e
          echo "AUDIT_EXIT=$code" >> "$GITHUB_ENV"
          exit $code

      # A RENDER_DEFECT writes quarantine entries; the published site must
      # reflect them (withheld markers), so rebuild before committing.
      # NOTE: data/quarantine.json and data/audit_report.json MUST be
      # TRACKED from the repo's first commit — `git diff` silently no-ops
      # on untracked files, so an untracked quarantine map would never
      # trigger this rebuild (red team #4, MINOR-12).
      - name: Rebuild if quarantine changed
        run: |
          if ! git diff --quiet -- data/quarantine.json; then
            echo "quarantine changed - rebuilding site with withheld markers"
            python -X utf8 build.py
          fi

      - name: Commit updated price data
        id: commit
        run: |
          git config user.name "HeliosPriceBot"
          git config user.email "brandon.william.hall@gmail.com"
          git add data/prices/ data/last_manifest.json data/promos.json data/handle_maps.json data/quarantine.json data/audit_report.json site/
          git diff --staged --quiet || git commit -m "Price update $(date +%Y-%m-%d_%H:%M)"
          git pull --rebase origin main && git push

      # Single alarm point, always last, so publishing has already happened
      # (or been deliberately skipped) before anything turns red.
      - name: Raise alarms
        if: always()
        run: |
          PROBLEMS=""
          if [ "${{ steps.shop_solar_kits.outcome }}" = "failure" ]; then
            echo "::error::shop-solar-kits scrape failed — dead retailer or crash."
            PROBLEMS="$PROBLEMS shop-solar-kits"
          fi
          if [ "${{ steps.wild_oak_trail.outcome }}" = "failure" ]; then
            echo "::error::wild-oak-trail scrape failed — dead retailer or crash."
            PROBLEMS="$PROBLEMS wild-oak-trail"
          fi
          if [ "${TESTS_FAILED:-0}" = "1" ]; then
            echo "::error::Test suite failed — code defect."
            PROBLEMS="$PROBLEMS tests"
          fi
          # Default 4, not 0: an audit that never wrote its exit code did
          # not verify anything, and unverified must never read as clean.
          case "${AUDIT_EXIT:-4}" in
            0) echo "Audit: clean." ;;
            3) echo "::error::Audit found RENDER_DEFECT(s) — site disagreed with its own price store; variants quarantined and withheld."
               PROBLEMS="$PROBLEMS audit-render-defect" ;;
            *) echo "::error::Audit incomplete/unverified (exit ${AUDIT_EXIT}) — an audit that could not verify is not a pass."
               PROBLEMS="$PROBLEMS audit-incomplete" ;;
          esac
          # Report-level alarms (SKU drift, capacity CONTRADICTED, ...)
          # are not taxonomy verdicts and can ride an AUDIT_EXIT of 0 —
          # without this consumer they reached nobody (red team #4,
          # MAJOR-5).
          if [ -f data/audit_report.json ]; then
            ALARM_COUNT=$(python -X utf8 -c "import json; print(len(json.load(open('data/audit_report.json', encoding='utf-8')).get('alarms', [])))")
            if [ "$ALARM_COUNT" != "0" ]; then
              python -X utf8 -c "import json; [print('::error::AUDIT ALARM: ' + a) for a in json.load(open('data/audit_report.json', encoding='utf-8')).get('alarms', [])]"
              PROBLEMS="$PROBLEMS audit-alarms"
            fi
          fi
          if [ "${{ steps.commit.outcome }}" != "success" ]; then
            echo "::error::Nothing was published this run (commit step: ${{ steps.commit.outcome }})."
            PROBLEMS="$PROBLEMS publish"
          fi
          if [ -n "$PROBLEMS" ]; then
            echo "Problems:$PROBLEMS"
            exit 1
          fi
          echo "All healthy: 2/2 scrapers, tests green, published."
